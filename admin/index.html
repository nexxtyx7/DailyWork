<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DailyWork • Administração</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#07111f;--glass:rgba(17,32,55,.48);--line:rgba(173,207,255,.16);--muted:#91a8c8;--blue:#83c5ff;--cyan:#70e1df;--white:#f1f7ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--white);font:15px Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;background:radial-gradient(ellipse at 12% 4%,rgba(48,119,190,.32),transparent 38%),radial-gradient(ellipse at 90% 20%,rgba(75,84,180,.25),transparent 34%),linear-gradient(135deg,#07111f 0%,#0b1729 48%,#10162b 100%);background-attachment:fixed}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:38px 38px;mask-image:linear-gradient(to bottom,black,transparent 85%)}
main{width:min(1240px,calc(100% - 48px));margin:34px auto 60px;position:relative}
.brand{display:flex;align-items:center;gap:13px;margin-bottom:30px;padding:13px 17px;border:1px solid var(--line);border-radius:20px;background:rgba(15,30,52,.42);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 16px 50px #0003}
.logo{width:44px;height:44px;border-radius:15px;background:linear-gradient(145deg,#b8e4ff,#70a9ff 55%,#7b80ff);display:grid;place-items:center;color:#08172b;font-weight:950;font-size:22px;box-shadow:0 7px 24px #5daaff55}
.brand h1{font-size:19px;letter-spacing:.2px;margin:0}.brand p{margin:4px 0 0;color:var(--muted);font-size:12px;letter-spacing:.5px}
.panel,.stat,.formbox,.duty{background:linear-gradient(145deg,rgba(27,48,77,.62),rgba(12,25,45,.58));border:1px solid var(--line);border-radius:22px;padding:22px;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 20px 55px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.07)}
.login{max-width:430px;margin:9vh auto;padding:30px}.login h2{margin-top:0;font-size:25px;letter-spacing:-.5px}
.muted{color:var(--muted)}label{display:block;color:#bdcce2;font-size:12px;font-weight:650;letter-spacing:.35px;margin:16px 0 8px}
input,textarea{width:100%;background:rgba(4,14,28,.55);color:var(--white);border:1px solid rgba(169,202,245,.18);border-radius:13px;padding:13px 14px;font:inherit;outline:none;transition:.2s}
input:focus,textarea:focus{border-color:#83c5ff;box-shadow:0 0 0 3px #83c5ff1c;background:rgba(7,20,38,.8)}
button{border:1px solid rgba(190,225,255,.24);border-radius:13px;padding:12px 17px;background:linear-gradient(135deg,#a7dcff,#78adff 58%,#9295ff);color:#07172b;font-weight:800;cursor:pointer;box-shadow:0 8px 24px rgba(83,155,255,.18);transition:transform .18s,filter .18s,box-shadow .18s}
button:hover{transform:translateY(-1px);filter:brightness(1.08);box-shadow:0 12px 28px rgba(83,155,255,.25)}
button.secondary{background:rgba(148,184,226,.09);color:#dcecff;border:1px solid rgba(174,209,250,.2);box-shadow:none}
button.danger{background:rgba(194,75,112,.13);color:#ffc3d3;border:1px solid rgba(255,125,164,.24);box-shadow:none}
.wide{width:100%;margin-top:18px}.hidden{display:none!important}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px}
.top h2{margin:0;font-size:26px;letter-spacing:-.7px}.top h3{margin:0;font-size:17px}
#welcome{font-size:13px;margin-top:6px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:18px}
.stat{position:relative;overflow:hidden;min-height:132px;padding:22px}
.stat:after{content:"";position:absolute;width:120px;height:120px;border-radius:50%;right:-40px;top:-48px;background:rgba(112,190,255,.10);filter:blur(3px)}
.stat small{color:#a8bdd9;font-size:12px;letter-spacing:.35px}.stat b{display:block;font-size:34px;letter-spacing:-1px;margin-top:12px;background:linear-gradient(90deg,#f5fbff,#8fcaff);-webkit-background-clip:text;background-clip:text;color:transparent}
.grid{display:grid;grid-template-columns:350px 1fr;gap:17px;align-items:start}
.formbox h3{margin:0 0 8px;font-size:18px}.formbox>p{font-size:13px;line-height:1.5}
.dutylist{display:grid;gap:11px;margin-top:15px}
.duty{padding:16px 17px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-radius:17px;background:rgba(7,19,35,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.045)}
.duty h4{margin:0 0 6px;font-size:14px}.duty p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}
.actions{display:flex;gap:8px;flex-shrink:0}.actions button{padding:9px 12px;font-size:12px}
.status{margin-top:13px;color:#a9bfdc;font-size:13px;min-height:18px}
@media(max-width:800px){main{width:min(100% - 28px,650px);margin:18px auto 40px}.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.top{align-items:flex-start}.duty{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions button{flex:1}}
@media(max-width:460px){.stats{gap:10px}.stat{padding:16px;min-height:112px}.stat b{font-size:28px}.panel,.formbox{padding:17px}.login{padding:24px}.top h2{font-size:22px}}
</style></head>
<body><main>
<header class="brand"><div class="logo">D</div><div><h1>DailyWork</h1><p>GLASS CRM · CENTRAL DE GESTÃO</p></div></header>
<section id="login" class="panel login"><h2>Acesso administrativo</h2><p class="muted">Entre com a conta autorizada como administradora.</p>
<form id="loginForm"><label>E-mail</label><input id="email" type="email" autocomplete="username" required><label>Senha</label><input id="password" type="password" autocomplete="current-password" required><button class="wide">Entrar no painel</button></form><div class="status" id="loginStatus"></div></section>
<section id="dashboard" class="hidden">
<div class="top"><div><h2>Dashboard</h2><div class="muted" id="welcome"></div></div><button class="secondary" id="logout">Sair</button></div>
<div class="stats"><div class="stat"><small>Contas criadas</small><b id="usersCount">—</b></div><div class="stat"><small>Instalações registradas</small><b id="installsCount">—</b></div><div class="stat"><small>Deveres publicados</small><b id="dutiesCount">—</b></div></div>
<div class="grid"><section class="formbox"><h3 id="formTitle">Adicionar dever</h3><p class="muted">O dever aparecerá para os alunos no aplicativo.</p>
<form id="dutyForm"><input id="dutyId" type="hidden"><label>Matéria</label><input id="subject" maxlength="50" placeholder="Ex.: Matemática" required><label>Título do dever</label><input id="title" maxlength="120" placeholder="Ex.: Exercícios da página 42" required><label>Data de entrega</label><input id="dueDate" type="date" required><label>Descrição (opcional)</label><textarea id="description" rows="3" maxlength="500" placeholder="Detalhes para os alunos"></textarea><button class="wide" id="saveDuty">Publicar dever</button><button class="wide secondary hidden" type="button" id="cancelEdit">Cancelar edição</button></form><div class="status" id="formStatus"></div></section>
<section class="panel"><div class="top"><h3>Deveres cadastrados</h3><button class="secondary" id="refresh">Atualizar</button></div><div id="duties" class="dutylist"><p class="muted">Carregando…</p></div></section></div>
</section></main>
<script>
const SUPABASE_URL='https://pwqiyoriewuxisliuwfb.supabase.co';
const SUPABASE_KEY='sb_publishable_bOZaiChvH4h35WtB2XueBQ_VLDq7zNx';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
let editing=[];
function message(id,msg){$(id).textContent=msg}
async function start(){
 const {data:{session}}=await sb.auth.getSession();
 if(session) await showDashboard();
}
async function showDashboard(){
 const {data:{user}}=await sb.auth.getUser();
 if(!user){$('login').classList.remove('hidden');$('dashboard').classList.add('hidden');return}
 const {data:profile,error}=await sb.from('profiles').select('full_name,role').eq('id',user.id).maybeSingle();
 if(error||!profile||profile.role!=='admin'){await sb.auth.signOut();$('login').classList.remove('hidden');$('dashboard').classList.add('hidden');message('loginStatus','Esta conta não tem permissão de administrador.');return}
 $('login').classList.add('hidden');$('dashboard').classList.remove('hidden');$('welcome').textContent='Olá, '+(profile.full_name||user.email);
 await Promise.all([loadStats(),loadDuties()]);
}
async function loadStats(){
 const [u,i,d]=await Promise.all([
 sb.from('profiles').select('id',{count:'exact',head:true}),
 sb.from('app_installs').select('install_id',{count:'exact',head:true}),
 sb.from('duties').select('id',{count:'exact',head:true})
 ]);
 $('usersCount').textContent=u.count??'—';$('installsCount').textContent=i.count??'—';$('dutiesCount').textContent=d.count??'—';
}
async function loadDuties(){
 const {data,error}=await sb.from('duties').select('*').order('due_date',{ascending:true});
 if(error){$('duties').textContent='Erro ao carregar deveres: '+error.message;return}
 editing=data||[];$('duties').innerHTML=editing.length?editing.map(d=>'<article class="duty"><div><h4>'+esc(d.subject)+' — '+esc(d.title)+'</h4><p>'+dateBR(d.due_date)+(d.description?' · '+esc(d.description):'')+'</p></div><div class="actions"><button class="secondary" data-edit="'+d.id+'">Editar</button><button class="danger" data-delete="'+d.id+'">Excluir</button></div></article>').join(''):'<p class="muted">Nenhum dever cadastrado.</p>';
 $('duties').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editDuty(b.dataset.edit));
 $('duties').querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteDuty(b.dataset.delete));
}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateBR(v){return new Date(v+'T12:00:00').toLocaleDateString('pt-BR')}
function resetForm(){$('dutyForm').reset();$('dutyId').value='';$('formTitle').textContent='Adicionar dever';$('saveDuty').textContent='Publicar dever';$('cancelEdit').classList.add('hidden')}
function editDuty(id){const d=editing.find(x=>x.id===id);if(!d)return;$('dutyId').value=d.id;$('subject').value=d.subject;$('title').value=d.title;$('dueDate').value=d.due_date;$('description').value=d.description||'';$('formTitle').textContent='Editar dever';$('saveDuty').textContent='Salvar alterações';$('cancelEdit').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}
async function deleteDuty(id){if(!confirm('Excluir este dever?'))return;const {error}=await sb.from('duties').delete().eq('id',id);if(error){message('formStatus',error.message);return}await loadDuties();await loadStats()}
$('loginForm').onsubmit=async e=>{e.preventDefault();message('loginStatus','Entrando…');const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){message('loginStatus',error.message);return}message('loginStatus','');await showDashboard()};
$('logout').onclick=async()=>{await sb.auth.signOut();$('dashboard').classList.add('hidden');$('login').classList.remove('hidden')};
$('dutyForm').onsubmit=async e=>{e.preventDefault();const id=$('dutyId').value;const row={subject:$('subject').value.trim(),title:$('title').value.trim(),due_date:$('dueDate').value,description:$('description').value.trim()||null,published:true,updated_at:new Date().toISOString()};const result=id?await sb.from('duties').update(row).eq('id',id):await sb.from('duties').insert(row);if(result.error){message('formStatus',result.error.message);return}message('formStatus',id?'Dever atualizado!':'Dever publicado!');resetForm();await Promise.all([loadDuties(),loadStats()])};
$('cancelEdit').onclick=resetForm;$('refresh').onclick=()=>Promise.all([loadStats(),loadDuties()]);
sb.auth.onAuthStateChange((_event,session)=>{if(!session){$('dashboard').classList.add('hidden');$('login').classList.remove('hidden')}});
start();
</script></body></html>
