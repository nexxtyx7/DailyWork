<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DailyWork • Nova senha</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080d18;color:#eef4ff;font:15px system-ui}.box{width:min(420px,calc(100% - 32px));padding:26px;border:1px solid #25334b;border-radius:20px;background:#111a2b}h1{font-size:22px}p{color:#9aabc5}label{display:block;margin:16px 0 7px}input{width:100%;padding:13px;border-radius:10px;background:#0a1220;border:1px solid #2a3a55;color:white}button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:10px;background:#70adff;color:#061326;font-weight:800}.msg{margin-top:12px;color:#a9c7f0}
</style></head><body><main class="box"><h1>Crie uma nova senha</h1><p>Escolha uma senha nova para acessar o DailyWork.</p><form id="form"><label>Nova senha</label><input id="pw" type="password" minlength="6" required><label>Confirmar senha</label><input id="pw2" type="password" minlength="6" required><button>Salvar nova senha</button></form><div class="msg" id="msg"></div></main><script>
const sb=window.supabase.createClient('https://pwqiyoriewuxisliuwfb.supabase.co','sb_publishable_bOZaiChvH4h35WtB2XueBQ_VLDq7zNx');
const msg=document.getElementById('msg');
sb.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')msg.textContent='Link validado. Defina sua nova senha.'});
document.getElementById('form').onsubmit=async e=>{e.preventDefault();const a=document.getElementById('pw').value,b=document.getElementById('pw2').value;if(a!==b){msg.textContent='As senhas não coincidem.';return}const {error}=await sb.auth.updateUser({password:a});if(error){msg.textContent=error.message;return}msg.textContent='Senha atualizada. Você já pode voltar ao aplicativo.';await sb.auth.signOut()};
</script></body></html>
